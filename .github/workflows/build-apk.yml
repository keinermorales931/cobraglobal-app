name: Generar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -q CobraGlobalApp.zip -d src

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK
        working-directory: src/CobraGlobalApp
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../CobraGlobal.apk

      - name: Publicar el APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CobraGlobal ${{ github.run_number }}
          body: |
            Descarga **CobraGlobal.apk** abajo, en "Assets", e instálala en tu celular Android.
            Android te pedirá permitir "Instalar apps desconocidas".
          files: CobraGlobal.apk
          make_latest: true
